name: Temporary Ghanaian topology narration render

on:
  pull_request:
    branches: [main]
    types: [opened, synchronize, reopened]

permissions:
  contents: read

jobs:
  render-shard-4:
    name: Render Ghanaian male English shard 4
    runs-on: ubuntu-latest
    timeout-minutes: 180
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install renderer dependencies
        run: python -m pip install --upgrade edge-tts numpy requests
      - name: Render Ghanaian narration shard 4
        env:
          SHARD_INDEX: '3'
          SHARD_COUNT: '4'
          OUTPUT_NAME: 'topology_ghanaian_shard_4.m4a'
        run: python tools/render_topology_ghanaian_abena.py
      - name: Upload narration shard
        uses: actions/upload-artifact@v4
        with:
          name: topology-ghanaian-male-english-shard-4
          path: |
            output/topology_ghanaian_shard_4.m4a
            output/topology_ghanaian_shard_4.json
          if-no-files-found: error
          retention-days: 1
